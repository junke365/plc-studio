name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build electron ts, shared, plc-core, server, editor
        run: |
          npm run build:electron:ts
          npm run build:shared
          npm run build:plc-core
          npm run build:server
          npm run build:server:bundle
          npm run build:editor
      - name: Package mac x64
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package mac arm64
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            release/*.dmg
            release/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build electron ts, shared, plc-core, server, editor
        run: |
          npm run build:electron:ts
          npm run build:shared
          npm run build:plc-core
          npm run build:server
          npm run build:server:bundle
          npm run build:editor
      - name: Package linux x64
        run: npx electron-builder --linux --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
      - name: Package linux arm64
        run: npx electron-builder --linux --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          USE_HARD_LINKS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap

  publish:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
