appId: com.smartplc.studio
productName: PLC Studio
directories:
  output: release
  buildResources: electron/build
files:
  - electron/dist/**/*
  - packages/editor/dist/**/*
  - packages/server/dist-server/**/*
  - "!node_modules/@xpack-dev-tools/**"
  - "!node_modules/**/{test,__tests__,tests,powered-test,example,examples}"
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@serialport/**/*"
  - "node_modules/better-sqlite3/**/*"
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
extraResources:
  - from: packages/runtime
    to: runtime
    filter:
      - "**/*"
